<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
		xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
<meta charset="UTF-8">
<title>글쓰기</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
	<div id="container">
		<h2>글쓰기</h2>
		<form th:action="@{/boards/write}" method="post"
				th:object="${boardDTO}" class="writeForm">
			<div th:if="${#fields.hasAnyErrors()}">
				<div th:each="err : ${#fields.allErrors()}"
					 th:text="${err}"></div>
			</div>
			<fieldset>
	    		<ul>
	    			<li>
	    				<input type="text" th:field="*{title}"
	    					placeholder="제목" size=62>
	    			</li>
	    			<li>
	    				<textarea name="content" rows="8" cols="60"
	    					th:field="*{content}" placeholder="내용"></textarea>
	    			</li>
	    			<li>
	    				<div sec:authorize="isAuthenticated()">
		    				<input type="text" name="writer" size=62
		    					  th:value="${#authentication.principal.name}">
	    				</div>
	    			</li>
	    			<li>
	    				<input type="submit" value="등록">
	    				<input type="reset" value="취소">
	    			</li>
	    		</ul>
	    	</fieldset>
		</form>
	</div>
</body>
</html>
